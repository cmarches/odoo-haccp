[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
; db_password is supplied via HOST/USER/PASSWORD env vars from docker-compose
; admin_passwd must be set before production use
workers = 2
max_cron_threads = 1
log_level = info
