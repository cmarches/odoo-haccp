version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: haccp-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - haccp-net

  influxdb:
    image: influxdb:2.7
    container_name: haccp-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=aifluence
      - DOCKER_INFLUXDB_INIT_BUCKET=haccp
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - haccp-net

  portainer:
    image: portainer/portainer-ce:2.20.3
    container_name: haccp-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - haccp-net

  # vNode est installé en natif via tarball Vester (vnode-setup-1.22.3-x86_64-linux-gnu.tar.gz)
  # et géré par systemd (sudo systemctl status vnode).
  # Ne pas dockeriser — la licence est liée au MAC de l'interface physique.

networks:
  haccp-net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  portainer_data:
