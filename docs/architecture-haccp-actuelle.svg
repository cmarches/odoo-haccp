<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,sans-serif;background:#0f172a;">

  <!-- Defs: gradients & markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <linearGradient id="grad-sensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e4d8c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-lora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-ttn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3730a3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#164e63;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-odoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-alert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-report" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#44403c;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- ===== ZONE LABELS ===== -->
  <!-- Terrain -->
  <rect x="10" y="30" width="150" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="85" y="22" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">TERRAIN</text>

  <!-- Réseau -->
  <rect x="175" y="30" width="140" height="250" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="245" y="22" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">RÉSEAU</text>

  <!-- Cloud -->
  <rect x="330" y="30" width="150" height="250" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="405" y="22" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">CLOUD LNS</text>

  <!-- Edge -->
  <rect x="175" y="300" width="305" height="260" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="327" y="292" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">EDGE NODE (OPS121S)</text>

  <!-- Backend -->
  <rect x="495" y="30" width="310" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="650" y="22" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">BACKEND ODOO 19 EE</text>

  <!-- Sorties -->
  <rect x="820" y="30" width="130" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="885" y="22" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">SORTIES</text>

  <!-- ===== CAPTEURS ===== -->
  <rect x="20" y="60" width="130" height="64" rx="8" fill="url(#grad-sensor)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="79" text-anchor="middle" font-size="10" fill="#93c5fd" font-weight="700">LHT65 #1</text>
  <text x="85" y="93" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Frigo Positif</text>
  <text x="85" y="108" text-anchor="middle" font-size="10" fill="#93c5fd">seuil &gt; 4°C</text>

  <rect x="20" y="148" width="130" height="64" rx="8" fill="url(#grad-sensor)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="167" text-anchor="middle" font-size="10" fill="#93c5fd" font-weight="700">LHT65 #2</text>
  <text x="85" y="181" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Congélateur</text>
  <text x="85" y="196" text-anchor="middle" font-size="10" fill="#93c5fd">seuil &gt; -15°C</text>

  <rect x="20" y="236" width="130" height="64" rx="8" fill="url(#grad-sensor)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="255" text-anchor="middle" font-size="10" fill="#93c5fd" font-weight="700">LHT65 #3</text>
  <text x="85" y="269" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Stockage Sec</text>
  <text x="85" y="284" text-anchor="middle" font-size="10" fill="#93c5fd">seuil &gt; 75% HR</text>

  <text x="85" y="340" text-anchor="middle" font-size="10" fill="#6366f1" font-style="italic">LoRaWAN Class A</text>
  <text x="85" y="354" text-anchor="middle" font-size="10" fill="#6366f1" font-style="italic">EU868 · batterie 5-8 ans</text>

  <!-- ===== GATEWAY ===== -->
  <rect x="185" y="130" width="120" height="60" rx="8" fill="url(#grad-lora)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="245" y="152" text-anchor="middle" font-size="10" fill="#c7d2fe" font-weight="700">GATEWAY</text>
  <text x="245" y="167" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">RAK7268</text>
  <text x="245" y="181" text-anchor="middle" font-size="10" fill="#c7d2fe">PoE · Indoor</text>

  <!-- Flèches capteurs → gateway -->
  <line x1="150" y1="92" x2="185" y2="160" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="150" y1="180" x2="185" y2="163" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="150" y1="268" x2="185" y2="172" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- ===== TTN ===== -->
  <rect x="340" y="120" width="130" height="80" rx="8" fill="url(#grad-ttn)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="405" y="148" text-anchor="middle" font-size="10" fill="#c7d2fe" font-weight="700">LNS</text>
  <text x="405" y="163" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">TTN</text>
  <text x="405" y="178" text-anchor="middle" font-size="10" fill="#c7d2fe">The Things Network</text>
  <text x="405" y="192" text-anchor="middle" font-size="10" fill="#c7d2fe">MQTT webhook</text>

  <!-- Flèche Gateway → TTN -->
  <line x1="305" y1="160" x2="340" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="152" text-anchor="middle" font-size="9" fill="#818cf8">HTTPS</text>

  <!-- ===== EDGE NODE ===== -->
  <rect x="185" y="315" width="130" height="55" rx="8" fill="url(#grad-edge)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="250" y="336" text-anchor="middle" font-size="10" fill="#a5f3fc" font-weight="700">vNode Automation</text>
  <text x="250" y="352" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Parser MQTT</text>
  <text x="250" y="366" text-anchor="middle" font-size="10" fill="#a5f3fc">→ tags structurés</text>

  <rect x="185" y="385" width="130" height="45" rx="8" fill="#164e63" stroke="#0891b2" stroke-width="1.2"/>
  <text x="250" y="404" text-anchor="middle" font-size="10" fill="#a5f3fc" font-weight="600">Mosquitto MQTT</text>
  <text x="250" y="420" text-anchor="middle" font-size="10" fill="#67e8f9">broker local</text>

  <rect x="335" y="385" width="130" height="45" rx="8" fill="#164e63" stroke="#0891b2" stroke-width="1.2"/>
  <text x="400" y="404" text-anchor="middle" font-size="10" fill="#a5f3fc" font-weight="600">InfluxDB</text>
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#67e8f9">time-series local</text>

  <line x1="250" y1="370" x2="250" y2="385" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="345" x2="395" y2="385" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

  <!-- Flèche TTN → vNode -->
  <path d="M405 200 Q405 270 330 320 Q300 335 315 340" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="380" y="255" text-anchor="middle" font-size="9" fill="#818cf8">MQTT/HTTPS</text>

  <!-- Fallback local -->
  <rect x="185" y="445" width="280" height="30" rx="5" fill="#1e3a2e" stroke="#166534" stroke-width="1"/>
  <text x="325" y="465" text-anchor="middle" font-size="10" fill="#86efac">Fallback local si Odoo injoignable (rare)</text>

  <!-- vNode → Odoo -->
  <line x1="315" y1="340" x2="510" y2="200" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="435" y="260" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="600">JSON-RPC 2.0 HTTPS</text>

  <!-- ===== ODOO ===== -->
  <rect x="510" y="50" width="275" height="95" rx="8" fill="url(#grad-odoo)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="647" y="72" text-anchor="middle" font-size="10" fill="#bbf7d0" font-weight="700">MODULE quality_control</text>
  <text x="647" y="90" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Points de Contrôle (QCPs)</text>
  <text x="515" y="115" font-size="10" fill="#bbf7d0">  QCP #1 · Frigo Positif — seuil 4°C</text>
  <text x="515" y="128" font-size="10" fill="#bbf7d0">  QCP #2 · Congélateur — seuil -15°C</text>
  <text x="515" y="141" font-size="10" fill="#bbf7d0">  QCP #3 · Stockage Sec — seuil 75% HR</text>

  <rect x="510" y="160" width="275" height="70" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="1.2"/>
  <text x="647" y="180" text-anchor="middle" font-size="10" fill="#bbf7d0" font-weight="700">quality.check (mesures IoT)</text>
  <text x="515" y="198" font-size="10" fill="#bbf7d0">  measure → measure_success (auto)</text>
  <text x="515" y="214" font-size="10" fill="#bbf7d0">  quality_state : pass / fail</text>

  <rect x="510" y="248" width="275" height="90" rx="8" fill="url(#grad-odoo)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="647" y="268" text-anchor="middle" font-size="10" fill="#bbf7d0" font-weight="700">MODULE haccp_report</text>
  <text x="647" y="286" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Rapport HACCP DDPP</text>
  <text x="515" y="305" font-size="10" fill="#bbf7d0">  Modèle haccp.report (persistant)</text>
  <text x="515" y="320" font-size="10" fill="#bbf7d0">  Template QWeb 6 sections · PDF</text>
  <text x="515" y="333" font-size="10" fill="#bbf7d0">  Menu Qualité › Rapports</text>

  <rect x="510" y="355" width="275" height="80" rx="8" fill="url(#grad-alert)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="647" y="375" text-anchor="middle" font-size="10" fill="#fed7aa" font-weight="700">ALERTES (canal principal)</text>
  <text x="515" y="395" font-size="10" fill="#fff">  t+0s → push ntfy.sh (iOS/Android)</text>
  <text x="515" y="410" font-size="10" fill="#fff">  t+10min → SMS secondaire</text>
  <text x="515" y="422" font-size="10" fill="#fff">  t+20min → appel Twilio</text>

  <rect x="510" y="450" width="275" height="55" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <text x="647" y="470" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">Dream Machine SE · Dual WAN</text>
  <text x="515" y="488" font-size="10" fill="#64748b">  Fibre ISP + 4G/LTE failover &lt; 30s</text>
  <text x="515" y="500" font-size="10" fill="#64748b">  Uptime 99.999% · IoT VLAN 10.10.10.x</text>

  <!-- Flèches internes Odoo -->
  <line x1="647" y1="145" x2="647" y2="160" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="647" y1="230" x2="647" y2="248" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="647" y1="338" x2="647" y2="355" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ===== SORTIES ===== -->
  <rect x="830" y="50" width="110" height="65" rx="8" fill="url(#grad-report)" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="885" y="72" text-anchor="middle" font-size="10" fill="#d6d3d1" font-weight="700">Rapport PDF</text>
  <text x="885" y="87" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">DDPP</text>
  <text x="885" y="102" text-anchor="middle" font-size="10" fill="#d6d3d1">archivage 3 ans</text>

  <rect x="830" y="135" width="110" height="55" rx="8" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
  <text x="885" y="155" text-anchor="middle" font-size="10" fill="#fed7aa" font-weight="700">ntfy.sh</text>
  <text x="885" y="170" text-anchor="middle" font-size="11" fill="#fff">Push mobile</text>
  <text x="885" y="183" text-anchor="middle" font-size="10" fill="#fed7aa">iOS · Android</text>

  <rect x="830" y="205" width="110" height="55" rx="8" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
  <text x="885" y="225" text-anchor="middle" font-size="10" fill="#fed7aa" font-weight="700">SMS</text>
  <text x="885" y="243" text-anchor="middle" font-size="11" fill="#fff">Secondaire</text>

  <rect x="830" y="275" width="110" height="55" rx="8" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
  <text x="885" y="295" text-anchor="middle" font-size="10" fill="#fed7aa" font-weight="700">Twilio</text>
  <text x="885" y="313" text-anchor="middle" font-size="11" fill="#fff">Appel vocal</text>

  <rect x="830" y="350" width="110" height="55" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="885" y="370" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">Inspecteur</text>
  <text x="885" y="387" text-anchor="middle" font-size="11" fill="#fff">DDPP</text>
  <text x="885" y="400" text-anchor="middle" font-size="10" fill="#94a3b8">contrôle terrain</text>

  <!-- Flèches Odoo → Sorties -->
  <line x1="785" y1="100" x2="830" y2="83" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="785" y1="395" x2="830" y2="162" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <line x1="785" y1="405" x2="830" y2="232" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <line x1="785" y1="410" x2="830" y2="302" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <line x1="785" y1="295" x2="830" y2="377" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Budget -->
  <rect x="20" y="490" width="130" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="85" y="508" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600">BUDGET MATÉRIEL POC</text>
  <text x="85" y="523" text-anchor="middle" font-size="11" fill="#f8fafc" font-weight="700">~735 EUR</text>
  <text x="85" y="537" text-anchor="middle" font-size="10" fill="#64748b">~6-7 EUR/mois opérationnel</text>

</svg>
